# Porta onde a API vai rodar
server.port=8080

# Configuração de conexão com o banco de dados MySQL
# (Certifique-se de criar um banco vazio chamado 'api_produtos' no seu MySQL antes de rodar)
spring.datasource.url=jdbc:mysql://localhost:3306/api_produtos?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=sua_senha_aqui

# Configuração do Hibernate (JPA)
# 'update' cria as tabelas automaticamente se não existirem e atualiza se você mudar algum atributo
spring.jpa.hibernate.ddl-auto=update

# Mostra no console os comandos SQL que o Spring está executando por baixo dos panos
spring.jpa.show-sql=true